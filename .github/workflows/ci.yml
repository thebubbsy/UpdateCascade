name: UpdateCascade CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Lint, Test & Validate
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python Verification Suite
        run: |
          python tests/test_cascade.py

      - name: Run Pester Tests
        shell: pwsh
        run: |
          Invoke-Pester -Path tests/UpdateCascade.Tests.ps1 -Output Detailed
